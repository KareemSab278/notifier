[package]
name = "notifier"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
expo_push_notification_client = "2.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]